# ~/.tmux.conf

# --- Prefix ---------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- General behavior ------------------------------------------------------
set -g mouse on                 # click to select pane/window, drag to resize, scroll to scroll
set -g base-index 1             # windows start at 1, not 0
setw -g pane-base-index 1       # panes start at 1, not 0
set -g renumber-windows on      # renumber windows when one is closed
set -g history-limit 50000      # bigger scrollback
set -g escape-time 10           # faster key response (default is laggy for vim/nvim)
set -g focus-events on
set -g set-clipboard on

# True color / italics support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# --- Reload config -----------------------------------------------------
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# --- Splits & navigation ----------------------------------------------------
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with prefix + arrows (repeatable)
bind -r Left resize-pane -L 5
bind -r Down resize-pane -D 5
bind -r Up resize-pane -U 5
bind -r Right resize-pane -R 5

# Alt+arrow to switch panes without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift+arrow to switch windows without prefix
bind -n S-Left previous-window
bind -n S-Right next-window

# --- Copy mode (vi-style) ---------------------------------------------------
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# --- Status bar --------------------------------------------------------
set -g status-position bottom
set -g status-interval 5
set -g status-justify left

set -g status-style bg=colour234,fg=colour137

set -g status-left-length 20
set -g status-left "#[fg=colour232,bg=colour37,bold] #S #[fg=colour37,bg=colour234,nobold]"

set -g status-right-length 60
set -g status-right "#[fg=colour233,bg=colour234] %Y-%m-%d #[fg=colour233,bg=colour234] %H:%M #[fg=colour37,bg=colour234]#[fg=colour232,bg=colour37,bold] #h "

setw -g window-status-current-style fg=colour81,bg=colour238,bold
setw -g window-status-current-format " #I:#W#F "

setw -g window-status-style fg=colour138,bg=colour235
setw -g window-status-format " #I:#W#F "

set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour81

set -g message-style fg=colour232,bg=colour81,bold
