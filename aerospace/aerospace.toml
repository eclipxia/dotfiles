# =============================================================================
# GLOBAL CALLBACK HANDLERS (Placed at the top to prevent TOML parsing errors)
# =============================================================================
exec-on-workspace-change = [
    '/bin/bash',
    '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE="$AEROSPACE_FOCUSED_WORKSPACE"'
]

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Gaps layout (Window positioning buffers below the notch framework)
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Mouse and focal window settings
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

[key-mapping]
    preset = 'qwerty'

[gaps]
    inner.horizontal = 8
    inner.vertical   = 8
    outer.left       = 8
    outer.bottom     = 8
    outer.right      = 8
    outer.top        = 5  # Clears the sketchybar bar (height 25)

# =============================================================================
# 'MAIN' BINDING MODE DECLARATION
# =============================================================================
[mode.main.binding]
    # Applications Shortcuts
    cmd-backtick = "exec-and-forget aerospace-scratchpad show 'Brave Browser' || open -a 'Brave Browser'"   

    # Fixed single line execution string to ensure no breakages happen in terminal mapping
    alt-enter = "exec-and-forget osascript -e 'tell application \"neovide\" to do script'"

    # Layout Controls
    cmd-slash = 'layout tiles horizontal vertical'
    cmd-comma = 'layout accordion horizontal vertical'

    # Structural Focus Rules
    cmd-h = 'focus left'
    cmd-j = 'focus down'
    cmd-k = 'focus up'
    cmd-l = 'focus right'

    # Window Actions
    cmd-shift-h = 'move left'
    cmd-shift-j = 'move down'
    cmd-shift-k = 'move up'
    cmd-shift-l = 'move right'

    # Window Resizing Parameters
    cmd-minus = 'resize smart -50'
    cmd-equal = 'resize smart +50'

    # Core Workspace Navigation (Matches Sketchybar names explicitly)
    cmd-1 = 'workspace 1:Code'
    cmd-2 = 'workspace 2:Notes'
    cmd-3 = 'workspace 3'
    cmd-4 = 'workspace 4'
    cmd-5 = 'workspace 5'
    cmd-6 = 'workspace 6'
    cmd-7 = 'workspace 7'
    cmd-8 = 'workspace 8'
    cmd-9 = 'workspace 9'

    # Move Tiled Windows to target paths (Fixed Name Matching rules)
    cmd-shift-1 = 'move-node-to-workspace 1:Code'
    cmd-shift-2 = 'move-node-to-workspace 2:Notes'
    cmd-shift-3 = 'move-node-to-workspace 3'
    cmd-shift-4 = 'move-node-to-workspace 4'
    cmd-shift-5 = 'move-node-to-workspace 5'
    cmd-shift-6 = 'move-node-to-workspace 6'
    cmd-shift-7 = 'move-node-to-workspace 7'
    cmd-shift-8 = 'move-node-to-workspace 8'
    cmd-shift-9 = 'move-node-to-workspace 9'

    # Navigation utilities
    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
    alt-shift-semicolon = 'mode service'

# =============================================================================
# 'SERVICE' BINDING MODE DECLARATION
# =============================================================================
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']
    f = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

    down = 'volume down'
    up = 'volume up'
    shift-down = ['volume set 0', 'mode main']

# =============================================================================
# APPLICATION FILTERS ARRAY BLOCKS (Must stay at the absolute bottom)
# =============================================================================
[[on-window-detected]]
if.app-id = 'com.brave.Browser'
run = ['layout floating']
